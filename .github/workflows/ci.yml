name: Continuous Integration

"on":
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    schedule:
        - cron: "0 0 * * MON"

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: read

env:
    # Fix for symfony/color detection. We know GitHub Actions can handle it
    ANSICON: 1
    CASTOR_CONTEXT: ci

jobs:
    check-dockerfiles:
        name: Check Dockerfile
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Check php/Dockerfile
              uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
              with:
                  dockerfile: infrastructure/docker/services/php/Dockerfile

    ci:
        name: Continuous Integration
        runs-on: ubuntu-latest
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to the Container registry
              shell: bash
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

            - name: setup-castor
              uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: "Build and start the infrastructure"
              run: "castor start"

            - name: "Check Security issues"
              run: "castor qa:security-audit"

            - name: "Check PHP coding standards"
              run: "castor qa:cs --dry-run"

            - name: "Run Twig CS"
              run: "castor qa:twig-cs --dry-run"

            - name: "Run PHPStan"
              run: |
                # PHPStan need the container to be compiled
                castor --context=ci builder -- bin/console about --env=dev
                castor qa:phpstan

            - name: "Run PHPUnit"
              run: "castor qa:phpunit"

            - name: "Test HTTP server"
              run: |
                  set -e
                  set -o pipefail

                  # The whole app sits behind HTTP Basic auth (see config/packages/security.yaml)
                  DASHBOARD_PASSWORD=$(grep -oP '^DASHBOARD_PASSWORD=\K.*' .env)
                  curl --fail --insecure --silent -u "monologue:${DASHBOARD_PASSWORD}" -H "Host: monologue.test" https://127.0.0.1 | grep "Monologue"
