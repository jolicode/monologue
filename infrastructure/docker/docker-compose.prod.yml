# Production images: self-contained (code baked in, no bind mounts), non-root,
# see the "Production stages" of services/php/Dockerfile.
#
# This file is only meant for LOCAL TESTING of those images, through the "prod"
# castor context: `castor build -c prod` and `castor docker:push -c prod --tag=...`
# build and push the "php" and "nginx" images (the CI does it on every push to
# main), `castor start -c prod` runs them in a minimal stack (dummy secrets, a
# throwaway database). The real production is not run with this file: the
# hosting orchestrator runs the images with its own database.

x-php-build: &php-build
    context: services/php
    additional_contexts:
        app: ../..
    args:
        PHP_VERSION: "${PHP_VERSION:-8.5}"

x-app-env: &app-env
    APP_SECRET: "${APP_SECRET:-not-a-secret}"
    DATABASE_URL: "postgresql://monologue:monologue@postgres:5432/monologue?serverVersion=16&charset=utf8"

volumes:
    postgres-data: {}
    # php-fpm unix socket, shared between the php and nginx containers
    php-socket: {}

services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_USER: monologue
            POSTGRES_PASSWORD: monologue
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U monologue"]
            interval: 5s
            timeout: 5s
            retries: 5

    php:
        build:
            <<: *php-build
            target: php
            cache_from:
                - "type=registry,ref=${REGISTRY:-ghcr.io/jolicode/monologue}/php:cache"
        image: "${REGISTRY:-ghcr.io/jolicode/monologue}/php:${TAG:-latest}"
        environment: *app-env
        env_file:
            # Optional, gitignored: real credentials (Slack, dashboard password...) for a local test.
            # Variables of the "environment" block above take precedence.
            - path: ../../.env.prod.local
              required: false
        volumes:
            - php-socket:/var/run/php
        depends_on:
            postgres:
                condition: service_healthy

    nginx:
        build:
            <<: *php-build
            target: nginx
            cache_from:
                - "type=registry,ref=${REGISTRY:-ghcr.io/jolicode/monologue}/nginx:cache"
        image: "${REGISTRY:-ghcr.io/jolicode/monologue}/nginx:${TAG:-latest}"
        ports:
            - "${HTTP_PORT:-8080}:8080"
        volumes:
            - php-socket:/var/run/php
        depends_on:
            php:
                condition: service_healthy
